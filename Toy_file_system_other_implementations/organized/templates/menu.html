<!DOCTYPE html>
<html>
<head>
    <title>File system</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="root"></div>
    <form id="redirect-form">
    <input
        type="text"
        id="redirect-input"
        placeholder="Enter path or URL (e.g. /files or https://example.com)"
        required
    />
    <button type="submit">Go</button>
    </form>
    <script type="text/babel" src="/static/js/redirect-form.js"></script>

<script>
    document.getElementById("redirect-form").addEventListener("submit", function (e) {
        e.preventDefault();
        const value = document.getElementById("redirect-input").value.trim();
        if (value) {
            window.location.href = value;
        }
    });
</script>

</body>
</html>
